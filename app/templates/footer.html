      <script>
        const menuButton = document.getElementById("menuToggle");
        const sidebarElement = document.getElementById("sidebarMenu");

        if (menuButton && sidebarElement) {
            const desktopBreakpoint = window.matchMedia("(min-width: 992px)");
            let sidebar = null;

            function createSidebar() {
            const existingSidebar = bootstrap.Offcanvas.getInstance(sidebarElement);

            if (existingSidebar) {
                existingSidebar.dispose();
            }

            sidebar = new bootstrap.Offcanvas(sidebarElement, {
                backdrop: !desktopBreakpoint.matches,
                scroll: desktopBreakpoint.matches
            });
            }

            function setSidebarState() {
            createSidebar();

            if (desktopBreakpoint.matches) {
                sidebar.show();
                document.body.classList.add("sidebar-open");
            } else {
                sidebar.hide();
                document.body.classList.remove("sidebar-open");
            }
            }

            menuButton.addEventListener("click", function () {
            if (!sidebar) {
                createSidebar();
            }

            sidebar.toggle();
            });

            sidebarElement.addEventListener("shown.bs.offcanvas", function () {
            document.body.classList.add("sidebar-open");
            });

            sidebarElement.addEventListener("hidden.bs.offcanvas", function () {
            document.body.classList.remove("sidebar-open");
            });

            setSidebarState();

            desktopBreakpoint.addEventListener("change", setSidebarState);
        }
        </script>
