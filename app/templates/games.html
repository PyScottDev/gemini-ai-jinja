
{% include "header.html" %}

<div class="container mt-3 mt-md-5">
  <div class="row">
    <main id="mainContent" class="col-12 col-md-9 ps-3 ps-md-5">

      <div class="mb-5">
        <h1 class="fw-bold">Games</h1>
        <p class="text-muted">
          Practise your English with interactive games.
        </p>
      </div>

      <!-- Cinema Chaos -->
      <div class="row mb-5 align-items-center">
        <div class="col-12 col-lg-8 order-2 order-lg-1">
          <a
            href="/games/cinema-chaos/"
            class="text-decoration-none text-dark"
          >
            <h2 class="fw-bold">Cinema Chaos</h2>
            <h3 class="h6 text-muted">
              Run a cinema ticket desk. Check tickets,
              question customers and make decisions.
            </h3>
          </a>
        </div>

        <div class="col-12 col-lg-4 order-1 order-lg-2 mb-3 mb-lg-0">
          <a href="/games/cinema-chaos/">
            <img
              src="{{ url_for('static', path='assets/img/cinema-chaos.webp') }}"
              class="img-fluid rounded"
              alt="Cinema Chaos screenshot"
              loading="lazy"
            />
          </a>
        </div>
      </div>
      <hr />

      <!-- Connect 4 -->
      <div class="row mb-5 align-items-center">
        <div class="col-12 col-lg-8 order-2 order-lg-1">
          <a
            href="/games/connect-4/"
            class="text-decoration-none text-dark"
          >
            <h2 class="fw-bold">Connect 4</h2>
            <h3 class="h6 text-muted">
              Play Connect 4 while practising English
              verbs and grammar.
            </h3>
          </a>
        </div>

        <div class="col-12 col-lg-4 order-1 order-lg-2 mb-3 mb-lg-0">
          <a href="/games/connect-4/">
            <img
              src="{{ url_for('static', path='assets/img/connect-4.webp') }}"
              class="img-fluid rounded"
              alt="Connect 4 game preview"
              loading="lazy"
            />
          </a>
        </div>
      </div>
      <hr />

    </main>
  </div>
</div>
